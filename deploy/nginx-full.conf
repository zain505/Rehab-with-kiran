worker_processes 1;

error_log logs/error.log;
pid logs/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    access_log logs/access.log;

    sendfile on;
    keepalive_timeout 65;

    # WebSocket / Socket.IO support
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Redirect HTTP requests to HTTPS
    server {
        listen 80;
        server_name hzhtechco.site www.hzhtechco.site;

        return 301 https://$host$request_uri;
    }

    # HTTPS server
    server {
        listen 443 ssl;
        server_name hzhtechco.site www.hzhtechco.site;

        ssl_certificate     C:/nginx-certs/hzhtechco.site/hzhtechco.site-crt.pem;
        ssl_certificate_key C:/nginx-certs/hzhtechco.site/hzhtechco.site-key.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        client_max_body_size 20M;

        # Normalize the Rehab With Kiran URL so relative asset paths work.
        location = /rehab-with-kiran {
            return 301 /rehab-with-kiran/;
        }

        # Serve the React production build from
        # C:/nginx/html/rehab-with-kiran.
        location ^~ /rehab-with-kiran/ {
            root C:/nginx/html;
            index index.html;
            try_files $uri $uri/ =404;
        }

        # Preserve the existing application at the domain root.
        location / {
            proxy_pass http://127.0.0.1:4000;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket / Socket.IO
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        error_page 502 503 504 /50x.html;

        location = /50x.html {
            root html;
        }
    }
}
