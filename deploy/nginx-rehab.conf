# Add these locations to the existing HTTPS server block for hzhtechco.site.
# Keep the site's existing root location and TLS configuration unchanged.

location = /rehab-with-kiran {
    return 301 /rehab-with-kiran/;
}

location ^~ /rehab-with-kiran/ {
    root C:/nginx/html;
    index index.html;
    try_files $uri $uri/ =404;
}
